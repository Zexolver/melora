name: Release

# Fires on version tags (v0.1.0, v0.2.0-alpha, ...), not on every push --
# the Android build in particular is too slow/costly to run on every
# commit. Tag once something's worth handing to someone to actually try.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # blitz-net's native-tls dependency uses OpenSSL on Linux
      # specifically (schannel on Windows, Security.framework on macOS,
      # if either of those targets is ever added back to this matrix).
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x86_64

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/melora dist/melora-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: melora-linux-x86_64
          path: dist/melora-linux-x86_64

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r27c
      # Vendoring the SDK/NDK ourselves (rather than relying on whatever
      # happens to be preinstalled on the runner image) so this build
      # doesn't silently start failing -- or silently start using a
      # different NDK/SDK version than what's actually been verified to
      # work -- if the image changes.
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/.android-sdk/ndk/r27c
      # i-slint-backend-android-activity's build script shells out to d8
      # to dex a small Java shim; on JDK 21 (what actions/setup-java and
      # this runner both default to) build-tools 34's d8 crashes with a
      # NullPointerException -- a known Slint/Android issue
      # (https://github.com/slint-ui/slint/issues/4973). Build-tools 35
      # doesn't have the bug; downgrading Java is the other documented
      # fix, but pinning a newer build-tools is less invasive here.
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64

      - name: Install Android NDK
        run: |
          curl -sS -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          mkdir -p "$(dirname "$ANDROID_NDK_ROOT")"
          unzip -q /tmp/ndk.zip -d "$(dirname "$ANDROID_NDK_ROOT")"
          mv "$(dirname "$ANDROID_NDK_ROOT")/android-ndk-${NDK_VERSION}" "$ANDROID_NDK_ROOT"
          rm /tmp/ndk.zip

      - name: Install Android SDK platform + build-tools
        run: |
          curl -sS -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm /tmp/cmdtools.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "platforms;android-30" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "platform-tools"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      # Debug-signed (cargo-apk auto-generates a debug keystore) rather
      # than a Play Store release build -- this is for installing on a
      # device to try it, not distribution. Release signing needs a real
      # keystore managed as a secret; add `[package.metadata.android.signing.release]`
      # and wire that up here if/when actual distribution is needed.
      - name: Build APK
        run: cargo apk build --target aarch64-linux-android --lib

      - name: Package
        run: |
          mkdir -p dist
          cp target/debug/apk/melora.apk dist/melora-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melora-android-arm64
          path: dist/melora-android-arm64.apk

  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
