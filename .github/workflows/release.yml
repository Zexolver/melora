name: Release

# Fires on version tags (v0.1.0, v0.2.0-alpha, ...), not on every push --
# the Android build in particular is too slow/costly to run on every
# commit. Tag once something's worth handing to someone to actually try.
on:
  push:
    tags: ["v*"]
  # Lets a run be kicked off by hand (or by an API call) against an
  # existing release -- e.g. after fixing a bug in this workflow itself,
  # without needing to cut a whole new tag just to re-trigger it.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach the built artifacts to"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # blitz-net's native-tls dependency uses OpenSSL on Linux
      # specifically (schannel on Windows, Security.framework on macOS,
      # if either of those targets is ever added back to this matrix).
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x86_64

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/melora dist/melora-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: melora-linux-x86_64
          path: dist/melora-linux-x86_64

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r27c
      # Vendoring the SDK/NDK ourselves (rather than relying on whatever
      # happens to be preinstalled on the runner image) so this build
      # doesn't silently start failing -- or silently start using a
      # different NDK/SDK version than what's actually been verified to
      # work -- if the image changes.
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/.android-sdk/ndk/r27c
      # i-slint-backend-android-activity's build script shells out to d8
      # to dex a small Java shim; on JDK 21 (what actions/setup-java and
      # this runner both default to) build-tools 34's d8 crashes with a
      # NullPointerException -- a known Slint/Android issue
      # (https://github.com/slint-ui/slint/issues/4973). Build-tools 35
      # doesn't have the bug; downgrading Java is the other documented
      # fix, but pinning a newer build-tools is less invasive here.
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64

      - name: Install Android NDK
        run: |
          curl -sS -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          mkdir -p "$(dirname "$ANDROID_NDK_ROOT")"
          unzip -q /tmp/ndk.zip -d "$(dirname "$ANDROID_NDK_ROOT")"
          mv "$(dirname "$ANDROID_NDK_ROOT")/android-ndk-${NDK_VERSION}" "$ANDROID_NDK_ROOT"
          rm /tmp/ndk.zip

      - name: Install Android SDK platform + build-tools
        run: |
          curl -sS -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm /tmp/cmdtools.zip
          # Accepting licenses and installing packages in one piped `yes |
          # sdkmanager ... <package list>` command is a known footgun:
          # sdkmanager can close stdout mid-install once it's done reading
          # license prompts, which SIGPIPEs `yes` and can silently cut the
          # package list short -- confirmed live, not hypothetical: a run
          # of this workflow failed with "Platform 30 is not installed"
          # even though it was in the list, because the log showed `yes:
          # standard output: Broken pipe` right after the previous package
          # finished unzipping. Splitting license acceptance (still piped,
          # since only that step prompts) from the actual package install
          # (no prompts left, so no pipe needed, so nothing can race)
          # removes the failure mode entirely rather than papering over it.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "platforms;android-30" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "platform-tools"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      # A real bug that failed this job on every past release: the NDK
      # (r23+, including the r27c pinned above) stopped shipping
      # target-prefixed binutils (`aarch64-linux-android-ranlib`,
      # `-ar`, `-strip`, ...) in favor of unprefixed `llvm-ranlib` etc.
      # Rust's own build (via the `AR_aarch64-linux-android`/
      # `CC_aarch64-linux-android` env vars cargo-apk sets) doesn't need
      # the old names, but blitz-net's vendored OpenSSL build
      # (`openssl-sys` with the `vendored` feature, needed since Android
      # has no system OpenSSL -- see Cargo.toml) shells out to its own
      # Configure/Makefile machinery, which still looks for
      # `${CROSS_COMPILE}ranlib` on `$PATH` the old autotools way and
      # fails with `aarch64-linux-android-ranlib: not found` /
      # `make: *** [Makefile:2796: install_dev] Error 127` without it.
      # Confirmed by reproducing this exact failure in a container
      # matching this job's toolchain (a bare `ubuntu-latest`-like image
      # lacks these symlinks the same way, since the NDK genuinely
      # doesn't provide them) and confirming the fix below resolves it.
      - name: Fix NDK toolchain PATH for openssl-src
        run: |
          mkdir -p "$HOME/ndk-shims"
          for tool in ar ranlib strip nm readelf objcopy objdump; do
            ln -sf "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-$tool" \
              "$HOME/ndk-shims/aarch64-linux-android-$tool"
          done
          echo "$HOME/ndk-shims" >> "$GITHUB_PATH"
          echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Debug-signed, using the project's own committed
      # `android/debug.keystore` (see Cargo.toml's
      # `[package.metadata.android.signing.dev]` and ARCHITECTURE.md's
      # Android section) rather than cargo-apk's auto-generated one --
      # this is for installing on a device to try it, not a Play Store
      # release build, but it's the SAME key on every run, which is what
      # makes each release installable as an update over the last one
      # instead of needing an uninstall first. Release signing needs a
      # real keystore managed as a secret; add
      # `[package.metadata.android.signing.release]` and wire that up
      # here if/when actual Play Store distribution is needed.
      - name: Build APK
        run: cargo apk build --target aarch64-linux-android --lib

      - name: Package
        run: |
          mkdir -p dist
          cp target/debug/apk/melora.apk dist/melora-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melora-android-arm64
          path: dist/melora-android-arm64.apk

  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # On a real tag push, github.ref_name is already the tag; the
          # workflow_dispatch input only matters (and is only set) when
          # this was triggered by hand against an existing release.
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
