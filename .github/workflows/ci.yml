name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Slint's winit backend needs real windowing/GL headers to compile
      # against, even for `cargo test` (no test here actually opens a
      # window, but the crate still links these). libssl-dev is for
      # blitz-net's native-tls, which uses OpenSSL on Linux specifically
      # (schannel on Windows, Security.framework on macOS -- see
      # release.yml, which doesn't need this package on those runners).
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
