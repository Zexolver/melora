[package]
name = "melora"
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-only"

# Built as a library (used by both the desktop binary below and Android's
# `android_main` entry point in src/lib.rs) as well as a `cdylib` -- the
# shared-object form Android's Java/Kotlin activity shim loads via JNI.
# `cdylib` alone can't be linked by our own `src/main.rs` bin target, so
# both are listed; the extra `cdylib` output on desktop builds is unused
# but harmless.
[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "melora"
path = "src/main.rs"

[dependencies]
slint = "1"
blitz-dom = "0.1"
blitz-html = "0.1"
blitz-traits = "0.1"
blitz-net = "0.1"
blitz-paint = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
lz4_flex = "0.11"
anyrender = "0.5"
anyrender_vello_cpu = "0.6"
boa_engine = "0.20"
boa_gc = "0.20"

# Slint's Android integration is its own backend, selected via this
# feature (see src/lib.rs's `android_main` and
# https://docs.rs/slint/latest/slint/android/index.html) rather than the
# desktop winit backend `slint = "1"` above pulls in by default.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1", features = ["backend-android-activity-06"] }
# blitz-net's `reqwest` dependency uses reqwest's "default-tls" (i.e.
# native-tls -> openssl-sys) feature unconditionally -- blitz-net doesn't
# expose a rustls option to opt out of it. There's no system OpenSSL to
# link against for Android, so `vendored` builds one from source at
# compile time using the NDK's own C toolchain instead (verified: without
# this, `openssl-sys`'s build script fails outright on this target with
# "Could not find directory of OpenSSL installation"). Desktop builds
# don't pay this cost -- system OpenSSL via pkg-config is fast and
# already relied on there.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
slint-build = "1"

# Evaluated as a second engine backend, per the rusty-web-browsers-any
# survey in ARCHITECTURE.md. Not wired into the tab pipeline yet -- kept as
# a dev-dependency exercised by tests/gosub_html5_smoke.rs.
[dev-dependencies]
gosub_css3 = { git = "https://github.com/gosub-io/gosub-engine" }
gosub_html5 = { git = "https://github.com/gosub-io/gosub-engine" }
gosub_interface = { git = "https://github.com/gosub-io/gosub-engine" }
gosub_shared = { git = "https://github.com/gosub-io/gosub-engine" }

# Read by `cargo apk` (https://github.com/rust-mobile/cargo-apk) to build
# and sign an APK from the `cdylib` target above -- see
# .github/workflows/release.yml and ARCHITECTURE.md's Android section.
#
# cargo-apk 0.10's config is `#[serde(flatten)]`-ed directly from
# `ndk_build::manifest::AndroidManifest`, which nests the SDK versions and
# app label under `sdk`/`application` sub-tables rather than accepting
# them as flat keys here -- confirmed by extracting cargo-apk's own
# source: flat `apk_label`/`target_sdk_version`/`min_sdk_version` keys (as
# this file had before) are simply unknown fields serde silently drops,
# so the APK was actually shipping with cargo-apk's own defaults
# (label "melora", minSdk 23, targetSdk whatever `ndk.default_target_platform()`
# resolves to) instead of what was declared here -- verified via `aapt
# dump badging` on the built APK before this fix.
[package.metadata.android]
package = "org.melora.browser"

[package.metadata.android.application]
label = "Melora"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Without this, every build signs with `cargo apk`'s auto-generated
# `~/.android/debug.keystore` -- fine for one machine's own repeated local
# builds (the file persists there across runs), but on GitHub Actions'
# ephemeral runners a *new random* debug key gets generated on every
# separate CI run, so every past release so far was actually signed with a
# different key than the one before it. Android refuses to install an
# update over an existing app when the signing certificate doesn't match
# (confirmed live: `adb install -r` of a same-key rebuild replaces the app
# in place; a different-key rebuild fails and needs an uninstall first) --
# that mismatch, not anything about version numbers, is what forces
# "uninstall to update." Pointing every build (local and CI) at this one
# checked-in keystore fixes it for good. This is the "dev"/debug profile
# specifically (`cargo apk build` with no `--release`, what this project
# actually ships) -- committing it is the normal, low-stakes thing to do
# for a debug key: alias/password are Android's own well-known debug
# defaults (`androiddebugkey`/`android`), not real secrets, and it isn't
# used for -- or a substitute for -- real Play Store release signing (see
# ARCHITECTURE.md's Android section and Roadmap for that separate,
# still-open task).
[package.metadata.android.signing.dev]
path = "android/debug.keystore"
keystore_password = "android"
